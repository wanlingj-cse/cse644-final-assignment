apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web
  labels:
    app: nginx-web
spec:
  replicas: 1 # 多实例，满足多运行实例要求
  selector:
    matchLabels:
      app: nginx-web
  template:
    metadata:
      labels:
        app: nginx-web
      # =========【新增】Prometheus采集注解 =========
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        prometheus.io/path: "/metrics"    
    spec:
      containers:
      - name: nginx
        image: wanlingj/cse644-custom-nginx:v1
        ports:
        - containerPort: 80
        volumeMounts:
        - name: storage
          mountPath: /usr/share/nginx/html/data
        # =========【新增】挂载nginx主配置文件 =========
        - name: nginx-conf-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      # =========【新增第二容器：exporter sidecar】 =========
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:latest
        args:
        - --nginx.scrape-uri=http://127.0.0.1/nginx_status
        ports:
        - containerPort: 9113
          name: metrics    
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: web-pvc
      - name: nginx-conf-volume
        configMap:
          name: nginx-config
          items:
          - key: nginx.conf
            path: nginx.conf
