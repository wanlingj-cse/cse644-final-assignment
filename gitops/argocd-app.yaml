apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cse644-a3-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wanlingj-cse/cse644-final-assignment.git
    targetRevision: main
    # 仅同步assignment3下资源，和A2完全隔离
    path: ~/cse644-final-assignment/cse644-final-assignment/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: "5s"
